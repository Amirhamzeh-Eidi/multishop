{% extends 'base.html' %}
{% block main %}
    <div class="container-fluid">
        <h2 class="section-title position-relative text-uppercase text-center mx-xl-5 mb-4"><span class="bg-secondary pr-3">Login</span></h2>
        <div class=" px-xl-5">
            <div class=" mb-5 contact-us" style="">
                <div class="contact-form bg-light p-30">
                    <div id="success"></div>
                    {% if messages %}
                        {% for message in messages %}
                            <div class="alert alert-{{ message.tags }}" role="alert">
                                {{ message }}
                            </div>
                        {% endfor %}
                    {% endif %}
                    <form method="post">
                        {% csrf_token %}
                        <div class="control-group">
                            {{form.username}}
                            <p class="help-block text-danger"></p>
                        </div>
                        <div class="control-group">
                            {{form.password}}
                            <p class="help-block text-danger"></p>
                        </div>
                        <button type="submit" class="btn btn-primary">Login</button>
                        {% if request.GET.next %}
                        <a type="button" href="{% url 'accounts:user_authentication'%}?next={{request.GET.next|urlencode}}" class="btn btn-primary">Login with SMS</a>
                        {% else %}
                        <a type="button" href="{% url 'accounts:user_authentication'%}" class="btn btn-primary">Login with SMS</a>
                        {% endif %}
                    </form>
                </div>
            </div>
        </div>
    </div>
{% endblock main %}
