{% extends 'base.html' %}
{% load static %}
{% block main %}
<div class="container-fluid">
    <div class="mr-auto">
        <div class="">
            <h5 class="section-title position-relative text-uppercase mb-3"><span class="bg-secondary pr-3">Billing Address</span></h5>
            <div class="bg-light p-30 mb-5">
                <form action="" method="post">
                    {% csrf_token %}
                    <div class="row">
                        {{form.errors}}
                        <div class="col-md-12 form-group">
                            {{form.is_default}}
                            <label for="{{form.is_default.id_for_label}}">default address </label>
                        </div>
                        <div class="col-md-6 form-group">
                            <label> Recipient name: </label>
                                {{form.recipient_name}}
                        </div>
                        <div class="col-md-6 form-group">
                            <label>Recipient phone:</label>
                            {{form.recipient_phone}}
                        </div>
                        <div class="col-md-6 form-group">
                            <label>Postal code:</label>
                            {{form.postal_code}}
                        </div>
                        <div class="col-md-6 form-group">
                            <label>Province:</label>
                            {{form.province}}
                        </div>
                        <div class="col-md-6 form-group">
                            <label>City:</label>
                            {{form.city}}
                        </div>
                        <div class="col-md-6 form-group">
                            <label>Full address:</label>
                            {{form.full_address}}
                        </div>
                        <div class="col-md-6 form-group">
                            <button type="submit" class="btn btn-primary">Send changes</button>
                            <a  class="btn btn-danger" href="{% url 'accounts:delete_address' address.id %}">Delete address</a>
                        </div>
                    </div>
                </form>
            </div>
        </div>
        
    </div>
</div>
<script>
    const getcitiesurl = "{% url 'accounts:get_cities' 0 %}";
</script>
<script src="{% static 'js/custom.js' %}"></script>
{% endblock main %}
